<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TimeMapper</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/map-tokens.css">
  <link rel="stylesheet" href="../shared/bottom-bar.css">
  <link rel="stylesheet" href="clock.css">
  <link rel="stylesheet" href="map.css">
  <link rel="stylesheet" href="timeline.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="app.css">
  <script src="../shared/theme.js"></script>
</head>

<body class="has-bottom-bar">
  <main class="app app-mobile">
    <!-- View 1: Clock -->
    <div id="clockView" class="view">
      <section class="clock-page">
        <div class="clock-face-wrap">
          <svg id="clockDial" class="clock-dial" viewBox="-36 -72 272 308" role="img" aria-label="">
            <circle class="clock-bezel" cx="100" cy="100" r="135"></circle>
            <g id="clockRing" class="clock-ring" aria-hidden="true"></g>
            <g id="clockNumerals" class="clock-numerals" aria-hidden="true"></g>
            <g id="clockMinuteTrack" class="clock-minute-track" aria-hidden="true"></g>
            <g id="clockMinuteTrackNumerals" class="clock-minute-track-numerals" aria-hidden="true"></g>
            <text id="clockInnerCityLabel" class="clock-ring-city-label" x="100" y="60" dy="0.35em" text-anchor="middle"></text>
            <text id="clockOuterCityLabel" class="clock-ring-city-label clock-ring-city-label--outer" x="100" y="-56" dy="0.35em" text-anchor="middle"></text>
            <path id="clockHourHand" class="clock-hand clock-hand--hour" d="M 97.5 100 L 97.5 38.330 L 100 34 L 102.5 38.330 L 102.5 100 Z"></path>
            <path id="clockMinuteHand" class="clock-hand clock-hand--minute" d="M 98.5 100 L 98.5 30.598 L 100 28 L 101.5 30.598 L 101.5 100 Z"></path>
            <circle class="clock-pivot" cx="100" cy="100" r="4.5"></circle>
          </svg>
        </div>
        <section class="clock-cities" aria-label="City list">
          <ul id="clockCityList" class="clock-city-list"></ul>
        </section>
      </section>
    </div>

    <!-- View 2: Timeline (Map & Timeline) -->
    <div id="timelineView" class="view" hidden>
      <section class="map-panel">
        <div class="map-content">
          <div class="map-shell">
            <img class="world-map" src="../../assets/world-map.jpg" fetchpriority="high" decoding="async" alt="World Map">
            <div class="hour-lines" aria-hidden="true"></div>
            <svg id="nightAreaOverlay" class="night-area-overlay" viewBox="0 0 100 100" preserveAspectRatio="none"
              aria-hidden="true">
              <path id="nightPath" d=""></path>
              <path id="nightPathRef" d=""></path>
            </svg>
            <div id="timezoneHoverBands" class="timezone-hover-bands"></div>
            <div id="cityLayer" class="city-layer" aria-label="City Pins"></div>
            <div id="mapTimeLabelLayer" class="map-time-label-layer" aria-hidden="true"></div>
          </div>
          <div id="mapTimeline" class="map-timeline" aria-hidden="true"></div>
        </div>
      </section>

      <section class="timeline-panel" aria-label="Timeline">
        <div id="timelineRows" class="timeline-rows"></div>
        <div id="timelineTrackOverlay" class="timeline-track-overlay">
          <div id="timelineIntervalsContainer" class="timeline-intervals-container" aria-hidden="true"></div>
          <div id="nowLine" class="timeline-vline now-line" aria-hidden="true"></div>
          <div id="scrubLinesContainer"></div>
        </div>
      </section>
    </div>

    <!-- View 3: Settings & Cities (Native Single Page View) -->
    <div id="settingsView" class="settings-view" hidden>
      <div class="container">
        <div class="settings-column">
          <!-- Card: 編輯城市清單 Cities -->
          <section class="settings-card" id="cardCities">
            <div class="card-header">
              <h2 class="section-title" data-i18n="currentCitiesTitle">編輯城市清單</h2>
              <button id="resetButton" class="reset-btn" type="button" data-i18n="resetCitiesBtn">預設範例</button>
            </div>
            <div class="current-cities-container">
              <div id="currentCitiesList" class="current-cities-list"></div>
              <div class="current-city-card add-city-card" id="addCityRow">
                <div class="add-card-placeholder" aria-hidden="true"></div>
                <input id="mobileAddCityName" class="city-name-input" type="text" readonly placeholder="" aria-label="City name">
                <select id="mobileAddCityContinent" class="city-continent-select" aria-label="Continent"></select>
                <select id="mobileAddCityZone" class="city-zone-select" aria-label="Timezone"></select>
                <div class="add-card-placeholder" aria-hidden="true"></div>
              </div>
            </div>
          </section>

          <!-- Card: 時段設定 Time Periods -->
          <section class="settings-card" id="cardPeriods">
            <div class="card-header">
              <div class="card-header-titles">
                <h2 class="section-title" data-i18n="periodCardTitle">時段設定</h2>
                <span class="control-desc" data-i18n="dragHandleDesc">拖曳手柄以調整時段範圍</span>
              </div>
              <button type="button" class="reset-btn" id="resetPeriodsButton" data-i18n="resetBtn">恢復預設</button>
            </div>

            <div class="time-periods-timeline-container">
              <div class="interactive-timeline-panel" id="interactiveTimelinePanel">
                <div class="hours interactive-hours" id="interactiveHours"></div>
                <div class="timeline-dividers-layer" id="timelineDividersLayer"></div>
              </div>
            </div>
          </section>

          <!-- Card: 其他 Other -->
          <section class="settings-card" id="cardOther">
            <h2 class="section-title" data-i18n="otherCardTitle">其他</h2>
            <div class="control-group">
              <div class="control-label-wrap">
                <span class="control-label" data-i18n="langSection">語言</span>
              </div>
              <select class="styled-select" id="mobileLangSelect" aria-label="Language">
                <option value="auto" data-i18n="langAuto">自動</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="zh">中文</option>
              </select>
            </div>

            <div class="divider"></div>

            <div class="control-group">
              <div class="control-label-wrap">
                <span class="control-label" data-i18n="themeLabel">佈景主題</span>
              </div>
              <select class="styled-select" id="mobileThemeSelect" aria-label="Theme">
                <option value="auto" data-i18n="themeAuto">自動</option>
                <option value="light" data-i18n="themeLight">淺色</option>
                <option value="dark" data-i18n="themeDark">深色</option>
              </select>
            </div>

            <div class="divider"></div>

            <div class="control-group sponsor-control-group">
              <div class="control-label-wrap">
                <span class="control-label" data-i18n="sponsorCardTitle">贊助支持</span>
              </div>
              <a href="https://github.com/sponsors/Amppa" target="_blank" rel="noopener noreferrer" class="sponsor-btn" data-i18n="sponsorBtn">☕ Buy me a coffee</a>
            </div>
          </section>

          <footer class="footer">
            <span class="version-label" id="versionLabel"></span>
          </footer>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-bar" aria-label="Primary">
      <span class="bottom-bar-indicator" aria-hidden="true"></span>
      <button class="bottom-bar-item is-active" type="button" data-view="clock" aria-current="page" data-i18n="navClock">時鐘</button>
      <button class="bottom-bar-item" type="button" data-view="timeline" data-i18n="navTimeline">時間軸</button>
      <button class="bottom-bar-item" type="button" data-view="settings" data-i18n="navSettings">設定</button>
    </nav>
  </main>
  <script type="module" src="app.js"></script>
</body>

</html>
