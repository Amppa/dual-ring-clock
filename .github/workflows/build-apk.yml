name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install

      - name: Stage Web Assets & Sync Capacitor
        run: npm run android:sync

      - name: Prepare Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using production keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/dualringclock-release.jks
            printf "storeFile=../keystore/dualringclock-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          else
            echo "No production keystore secret found; generating self-signed keystore for release..."
            keytool -genkeypair -v \
              -keystore android/keystore/dualringclock-release.jks \
              -alias dualringclock \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass androidrelease -keypass androidrelease \
              -dname "CN=DualRingClock, OU=Mobile, O=DualRing, L=Taipei, ST=Taiwan, C=TW"
            printf "storeFile=../keystore/dualringclock-release.jks\nstorePassword=androidrelease\nkeyAlias=dualringclock\nkeyPassword=androidrelease\n" > android/keystore.properties
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        id: prepare_artifact
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
            VERSION="latest"
          fi
          APK_NAME="DualRingClock-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "apk_path=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.apk_name }}
          path: ${{ steps.prepare_artifact.outputs.apk_path }}

      - name: Publish to GitHub Releases (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DualRing Clock ${{ github.ref_name }}
          files: ${{ steps.prepare_artifact.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
